plugins {
    id 'java-library'
    id 'maven-publish'
}
def libraryProperties = new Properties()
file('../gradle.properties').withInputStream { libraryProperties.load(it) }
group = libraryProperties.getProperty('maven_group')
version = libraryProperties.getProperty('mod_version')
base.archivesName = "${libraryProperties.getProperty('archives_name')}-core"
repositories { mavenCentral() }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
    withJavadocJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
