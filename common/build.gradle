architectury { common minecraftProfile.enabled_platforms.split(',') }
dependencies {
    api project(':core')
    modCompileOnly "net.fabricmc:fabric-loader:${minecraftProfile.fabric_loader_version}"
}
tasks.matching { it.name.startsWith('transformProduction') }.configureEach {
    doFirst { project.file('.gradle/.architectury-transformer').mkdirs() }
}
